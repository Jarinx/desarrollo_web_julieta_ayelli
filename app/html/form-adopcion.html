<!-- Formulario para agregar aviso de adopción -->
<!DOCTYPE html>
<html lang="es">
    <head>
        <title>PET x FAMILY</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>

    <!-- Body -->
    <body>
        <!-- Header -->
        <header>
            <a href="portada.html"> Volver a la portada</a>
            <h1>Formulario para agregar un aviso de adopción</h1>
        </header>

        <!-- Formulario -->
        <form id="form-adopcion">
            <!-- ¿donde? -->
            <fieldset>
                <legend>¿Dónde?:</legend>
                <div>
                    <label for="region">Región (obligatorio)</label>
                    <select id="region" name="region" required>
                        <option value="">-- Selecciona región --</option>
                        <option value="rm">Región Metropolitana</option>
                        <option value="valp">Región de Valparaíso</option>
                    </select>
                </div>
                <div>
                    <label for="comuna">Comuna (obligatorio)</label>
                    <select id="comuna" name="comuna" required>
                        <option value="">-- Selecciona comuna --</option>
                    </select>
                </div>
                <div>
                    <label for="sector">Sector (opcional)</label>
                    <input type="text" id="sector" name="sector" maxlength="100" placeholder="Ej: Beauchef 850, terraza">
                    <small>Máximo 100 caracteres</small>
                </div>
            </fieldset>

            <!-- ¿contacto? -->
            <fieldset>
            <legend>¿Contacto de esta publicación?</legend>
                <div>
                    <label for="nombre">Nombre (obligatorio)</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" maxlength="200" placeholder="Ej: Juan Pérez">
                    <small>Mínimo 3 y máximo 100 caracteres</small>
                </div>
                <div>
                    <label for="email">Email (obligatorio)</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="Ej: hola@gmail.com">
                </div>
                <div>
                    <label for="celular">Celular (opcional)</label>
                    <input type="tel" id="celular" name="celular" maxlength="13" placeholder="Ej: +569.12345678">
                    <small>Formato válido: +NNN.NNNNNNNN</small>
                </div>
                <div>
                    <label for="contactar-por">Contactar por (opcional)</label>
                    <select id="contactar-por" name="contactar-por" size="6" multiple>
                        <option value="">-- Selecciona medio de contacto --</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="telegram">Telegram</option>
                        <option value="x">X</option>
                        <option value="instagram">Instagram</option>
                        <option value="tiktok">TikTok</option>
                        <option value="otra">Otra</option>
                    </select>
                    <small>Máximo 5 opciones</small>
                </div>
            </fieldset>

            <!-- ¿mascota? -->
            <fieldset>
            <legend>¿Qué mascota ofrece en adopción?</legend>
                <div>
                    <label for="tipo-mascota">Tipo de mascota (obligatorio)</label>
                    <input type="radio" id="tipo-mascota-perro" name="tipo-mascota-perro" value="perro">Perro
                    <input type="radio" id="tipo-mascota-gato" name="tipo-mascota-gato" value="gato">Gato
                </div>
                <div>
                    <label for="cantidad">Cantidad (obligatorio)</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" placeholder="Ej: 3" required> 
                </div>
                <div>
                    <label for="edad">Edad (obligatorio)</label>
                    <input type="number" id="edad" name="edad" maxlength="50" placeholder="Ej: 2" required>
                </div>
                <div>
                    <label for="unidad-edad">Unidad de edad (obligatorio)</label>
                    <input type="radio" id="unidad-edad-anios" name="unidad-edad-anios" value="años">Años
                    <input type="radio" id="unidad-edad-meses" name="unidad-edad-meses" value="meses">Meses
                </div>
                <div>
                    <label for="fecha-entrega">Fecha disponible para entrega</label>
                    <input type="datetime-local" id="fecha-entrega" name="fecha-entrega">
                </div>

            </fieldset>

        </form>
    </body>
</html>
